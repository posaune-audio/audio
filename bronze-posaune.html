<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Audios für Bronze Posaune</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f4f4f4;color:#222}.container{max-width:760px;margin:auto;padding:28px 16px 50px}header{text-align:center;margin-bottom:24px}h1{font-size:30px;margin:0 0 8px}.subtitle{color:#666}.speed-box{position:sticky;top:0;z-index:10;background:#fff;padding:18px;border-radius:16px;margin-bottom:22px;box-shadow:0 3px 14px #0002}.speed-header,.speed-scale{display:flex;justify-content:space-between;align-items:center}.speed-value{font-size:20px;font-weight:bold}.speed-slider{width:100%}.speed-scale{font-size:12px;color:#888}.reset-button{display:block;margin:14px auto 0;padding:9px 16px;border:1px solid #ccc;border-radius:8px;background:#fafafa}.audio-card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #0001}.number{color:#888;font-size:13px;margin-bottom:4px}.audio-title{font-size:18px;font-weight:600;margin-bottom:12px}audio{width:100%}footer{text-align:center;color:#888;font-size:13px;margin-top:34px}</style></head>
<body><div class="container"><header><h1>🎺 Audios für Bronze Posaune</h1><div class="subtitle">Audioaufnahmen zum Üben</div></header>
<div class="speed-box"><div class="speed-header"><b>Geschwindigkeit</b><span class="speed-value" id="speedValue">100 %</span></div><input id="speedSlider" class="speed-slider" type="range" min="50" max="150" value="100" step="1"><div class="speed-scale"><span>50 %</span><span>100 %</span><span>150 %</span></div><button id="resetSpeed" class="reset-button">Zurück auf 100 %</button></div><div id="audioList"></div><footer>Audios für Bronze Posaune</footer></div>
<script>
const tracks=[
["Concertino – Solo","Concertino.mp3"],["Concertino – Playback 1","Concertino Playback1.mp3"],["Concertino – Playback 2","Concertino Playback2.mp3"],["Concertino – Playback 3","Concertino Playback3.mp3"],["Alla Marcia – Solo","Alla Marcia.mp3"],["Alla Marcia – Playback","Alla Marcia Playback.mp3"],["Suchen und Finden – Solo","Suchen und finden.mp3"],["Suchen und Finden – Playback 1","Suchen und finden Playback1.mp3"],["Suchen und Finden – Playback 2","Suchen und finden Playback2.mp3"],["Song for Maria – Solo","Song for Maria playalong mit Solo.m4a"],["Song for Maria – Playback","Song for Maria Klavier playalong.m4a"],["Moderato – Solo (Bel Canto)","04 Moderato Solo, Bel Canto.mp3"],["Moderato – Playback (Bel Canto)","05 Moderato, Playback, Bel Canto.mp3"],["Andante Sostenuto – Solo (Bel Canto)","06 Andante Sonstenuto, Solo, Bel Canto.mp3"],["Andante Sostenuto – Playback (Bel Canto)","07 Andante Sostenuto, Playback, Bel Canto.mp3"],["Sostenuto Molto – Solo (Bel Canto)","08 Sostenuto Molto, Solo, Bel Canto.mp3"],["Sostenuto Molto – Playback (Bel Canto)","09 Sostenuto Molto, Playback, Bel Canto.mp3"],["Burg Schreckenstein – Solo","09 Burg Schreckenstein, Solo, Concerto Primo.mp3"],["Burg Schreckenstein – Playback","10 Burg Schreckenstein, Playback, Concerto Primo.mp3"],["Could You Repeat That?","11 Could You Repeat That?, Skilful Solos.mp3"],["Alladale Aria","12 Alladale Aria, Skilful Solos.mp3"],["Scales of Justice","13 Scales Of Justice, Skilful Solos.mp3"],["Thinking of You","19 Thinking Of You, Skilful Solos.mp3"]];
const list=document.getElementById("audioList"),slider=document.getElementById("speedSlider"),value=document.getElementById("speedValue"),reset=document.getElementById("resetSpeed");let speed=1;
const path=f=>"bronze-posaune/"+encodeURIComponent(f);
tracks.forEach((t,i)=>{let c=document.createElement("div");c.className="audio-card";let n=document.createElement("div");n.className="number";n.textContent="Nr. "+(i+1);let title=document.createElement("div");title.className="audio-title";title.textContent=t[0];let a=document.createElement("audio");a.controls=true;a.preload="metadata";a.src=path(t[1]);if("preservesPitch"in a)a.preservesPitch=true;if("webkitPreservesPitch"in a)a.webkitPreservesPitch=true;a.addEventListener("play",()=>{document.querySelectorAll("audio").forEach(x=>{if(x!==a)x.pause()});a.playbackRate=speed});c.append(n,title,a);list.appendChild(c)});
function setSpeed(p){speed=p/100;value.textContent=p+" %";document.querySelectorAll("audio").forEach(a=>{a.playbackRate=speed;if("preservesPitch"in a)a.preservesPitch=true;if("webkitPreservesPitch"in a)a.webkitPreservesPitch=true})}slider.addEventListener("input",()=>setSpeed(+slider.value));reset.addEventListener("click",()=>{slider.value=100;setSpeed(100)});setSpeed(100);
</script></body></html>
