<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audios für Bronze Posaune</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 28px 16px 50px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 30px;
            margin: 0 0 8px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .speed-box {
            position: sticky;
            top: 0;
            z-index: 10;
            background: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 22px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.10);
        }

        .speed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .speed-label {
            font-weight: 600;
        }

        .speed-value {
            font-size: 20px;
            font-weight: bold;
        }

        .speed-slider {
            width: 100%;
        }

        .speed-scale {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .reset-button {
            display: block;
            margin: 14px auto 0;
            padding: 9px 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fafafa;
            color: #333;
            font-size: 14px;
        }

        .audio-card {
            background: white;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }

        .number {
            color: #888;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .audio-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        audio {
            width: 100%;
        }

        footer {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 34px;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>🎺 Audios für Bronze Posaune</h1>
        <div class="subtitle">Audioaufnahmen zum Üben</div>
    </header>

    <div class="speed-box">

        <div class="speed-header">
            <span class="speed-label">Geschwindigkeit</span>
            <span class="speed-value" id="speedValue">100 %</span>
        </div>

        <input
            id="speedSlider"
            class="speed-slider"
            type="range"
            min="50"
            max="150"
            value="100"
            step="1"
        >

        <div class="speed-scale">
            <span>50 %</span>
            <span>100 %</span>
            <span>150 %</span>
        </div>

        <button id="resetSpeed" class="reset-button">
            Zurück auf 100 %
        </button>

    </div>

    <div id="audioList"></div>

    <footer>
        Audios für Bronze Posaune
    </footer>

</div>

<script>

const tracks = [

    {
        title: "Concertino – Solo",
        file: "bronze/Concertino.mp3"
    },

    {
        title: "Concertino – Playback 1",
        file: "bronze/Concertino Playback1.mp3"
    },

    {
        title: "Concertino – Playback 2",
        file: "bronze/Concertino Playback2.mp3"
    },

    {
        title: "Concertino – Playback 3",
        file: "bronze/Concertino Playback3.mp3"
    },

    {
        title: "Alla Marcia – Solo",
        file: "bronze/Alla Marcia.mp3"
    },

    {
        title: "Alla Marcia – Playback",
        file: "bronze/Alla Marcia Playback.mp3"
    },

    {
        title: "Suchen und Finden – Solo",
        file: "bronze/Suchen und finden.mp3"
    },

    {
        title: "Suchen und Finden – Playback 1",
        file: "bronze/Suchen und finden Playback1.mp3"
    },

    {
        title: "Suchen und Finden – Playback 2",
        file: "bronze/Suchen und finden Playback2.mp3"
    },

    {
        title: "Song for Maria – Solo",
        file: "bronze/Song for Maria playalong mit Solo.m4a"
    },

    {
        title: "Song for Maria – Playback",
        file: "bronze/Song for Maria Klavier playalong.m4a"
    },

    {
        title: "Moderato – Solo (Bel Canto)",
        file: "bronze/04 Moderato Solo, Bel Canto.mp3"
    },

    {
        title: "Moderato – Playback (Bel Canto)",
        file: "bronze/05 Moderato, Playback, Bel Canto.mp3"
    },

    {
        title: "Andante Sostenuto – Solo (Bel Canto)",
        file: "bronze/06 Andante Sonstenuto, Solo, Bel Canto.mp3"
    },

    {
        title: "Andante Sostenuto – Playback (Bel Canto)",
        file: "bronze/07 Andante Sostenuto, Playback, Bel Canto.mp3"
    },

    {
        title: "Sostenuto Molto – Solo (Bel Canto)",
        file: "bronze/08 Sostenuto Molto, Solo, Bel Canto.mp3"
    },

    {
        title: "Sostenuto Molto – Playback (Bel Canto)",
        file: "bronze/09 Sostenuto Molto, Playback, Bel Canto.mp3"
    },

    {
        title: "Burg Schreckenstein – Solo",
        file: "bronze/09 Burg Schreckenstein, Solo, Concerto Primo.mp3"
    },

    {
        title: "Burg Schreckenstein – Playback",
        file: "bronze/10 Burg Schreckenstein, Playback, Concerto Primo.mp3"
    },

    {
        title: "Could You Repeat That?",
        file: "bronze/11 Could You Repeat That?, Skilful Solos.mp3"
    },

    {
        title: "Alladale Aria",
        file: "bronze/12 Alladale Aria, Skilful Solos.mp3"
    },

    {
        title: "Scales of Justice",
        file: "bronze/13 Scales Of Justice, Skilful Solos.mp3"
    },

    {
        title: "Thinking of You",
        file: "bronze/19 Thinking Of You, Skilful Solos.mp3"
    }

];

const audioList = document.getElementById("audioList");
const slider = document.getElementById("speedSlider");
const speedValue = document.getElementById("speedValue");
const resetButton = document.getElementById("resetSpeed");

let currentSpeed = 1;

tracks.forEach((track, index) => {

    const card = document.createElement("div");
    card.className = "audio-card";

    const number = document.createElement("div");
    number.className = "number";
    number.textContent = "Nr. " + (index + 1);

    const title = document.createElement("div");
    title.className = "audio-title";
    title.textContent = track.title;

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "metadata";
    audio.src = encodeURI(track.file);

    if ("preservesPitch" in audio) {
        audio.preservesPitch = true;
    }

    if ("webkitPreservesPitch" in audio) {
        audio.webkitPreservesPitch = true;
    }

    audio.addEventListener("play", function () {

        document.querySelectorAll("audio").forEach(otherAudio => {
            if (otherAudio !== audio) {
                otherAudio.pause();
            }
        });

        audio.playbackRate = currentSpeed;

    });

    card.appendChild(number);
    card.appendChild(title);
    card.appendChild(audio);

    audioList.appendChild(card);

});

function updateSpeed(percent) {

    currentSpeed = percent / 100;

    speedValue.textContent = percent + " %";

    document.querySelectorAll("audio").forEach(audio => {

        audio.playbackRate = currentSpeed;

        if ("preservesPitch" in audio) {
            audio.preservesPitch = true;
        }

        if ("webkitPreservesPitch" in audio) {
            audio.webkitPreservesPitch = true;
        }

    });

}

slider.addEventListener("input", function () {
    updateSpeed(Number(slider.value));
});

resetButton.addEventListener("click", function () {
    slider.value = 100;
    updateSpeed(100);
});

updateSpeed(100);

</script>

</body>
</html>
